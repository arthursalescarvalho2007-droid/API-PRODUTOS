spring.application.name=api-crud-java
server.port=8081

# Copie a string JDBC da aba Connect do projeto Supabase e defina SUPABASE_DB_URL.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema "app" deve ser criado no SQL Editor do Supabase antes de iniciar a API.
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
